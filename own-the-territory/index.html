<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Britton Leggett">
<meta name="description" content="Own the Territory v3: drive your truck around a pixel-art sales territory, talk to buyers SPIN-style, and decide what NOT to do. Nobody hands you a schedule. Public beta.">
<title>Own the Territory</title>
<style>
:root{
  --bg:#141a24; --bg2:#1d2533; --card:#232d3e; --line:#3a4760;
  --text:#f3efe4; --muted:#c3cad6; --accent:#ffd25a; --accent2:#7fd0ff;
  --good:#7ee08a; --bad:#ff9a8a; --btn:#2f3c54; --btnh:#3b4b69; --focus:#ffd25a;
  --dlg:#0d1233; --dlgline:#f3efe4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:ui-monospace,"Cascadia Mono","Consolas",monospace;letter-spacing:.02em;line-height:1.25;margin:0 0 .4em}
h2{font-size:1.15rem;color:var(--accent)}
h3{font-size:1rem;color:var(--accent2);margin-top:.8em}
button{font:inherit;color:var(--text);background:var(--btn);border:2px solid var(--line);border-radius:8px;padding:.45em .7em;cursor:pointer;min-height:44px;text-align:left}
button:hover:not(:disabled){background:var(--btnh)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:#8a5a00;border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:#a06a00}
#app{max-width:1320px;margin:0 auto;padding:10px 16px 24px}
#hud{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.hud-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
#when{font-family:ui-monospace,Consolas,monospace;font-size:1rem}
#when b{color:var(--accent)}
.hud-btns{display:flex;gap:6px}
.hud-btns button{min-height:38px;padding:.3em .7em;font-size:.95rem;text-align:center}
#stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 12px;margin-top:6px}
.stat{font-size:.86rem}
.stat .lab{display:flex;justify-content:space-between;color:var(--muted);gap:4px}
.stat .lab b{color:var(--text)}
.bar{height:8px;background:#0c1018;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent2)}
#main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
#stageCol{min-width:0}
#stage{position:relative;border:3px solid #000;border-bottom:none;border-radius:10px 10px 0 0;overflow:hidden;background:#000;line-height:0}
#view{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:pointer}
#labels{position:absolute;left:0;top:0;width:100%;aspect-ratio:416/224;pointer-events:none}
.lbl{position:absolute;transform:translateX(-50%);background:rgba(10,14,22,.82);color:#fff;font:600 clamp(9px,1.2vw,13px)/1.2 system-ui,Arial,sans-serif;padding:2px 5px;border-radius:4px;white-space:nowrap;pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.25)}
.lbl.here{background:#1f5f3f;border-color:var(--good)}
.lbl .bang{color:#141a24;background:var(--accent);border-radius:3px;padding:0 4px;margin-left:3px;font-weight:800}
.lbl .riv{color:#fff;background:#b8322a;border-radius:3px;padding:0 4px;margin-left:3px;font-weight:800}
body:not(.mode-map) #labels{display:none}
#cap{position:absolute;left:8px;top:8px;background:#0d1233d9;color:#fff;border:2px solid #f3efe4;border-radius:6px;padding:2px 8px;font:700 clamp(11px,1.3vw,14px)/1.4 ui-monospace,Consolas,monospace;pointer-events:none}
body.mode-map #cap,#cap:empty{display:none}
#banner{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#0d1233ee;color:var(--accent);border:2px solid var(--accent);border-radius:8px;padding:6px 12px;font:700 clamp(12px,1.6vw,16px)/1.3 ui-monospace,Consolas,monospace;line-height:1.3;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90%;text-align:center}
#banner.show{opacity:1}
/* touch d-pad */
#dpad{position:absolute;left:8px;bottom:8px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad button{min-height:0;padding:0;text-align:center;font-size:20px;background:rgba(20,26,36,.72);border:2px solid rgba(255,255,255,.5);border-radius:8px;color:#fff;touch-action:none}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .r{grid-column:3;grid-row:2}#dpad .d{grid-column:2;grid-row:3}
#btnA{position:absolute;right:18px;bottom:40px;display:none;width:64px;height:64px;min-height:0;border-radius:50%;text-align:center;padding:0;font:800 15px/1 system-ui,Arial;background:rgba(138,90,0,.85);border:2px solid var(--accent);color:#fff;touch-action:none}
body.touch.mode-map #stage{padding-bottom:150px;background:#10162a}
body.touch.mode-map #dpad{display:grid}
body.touch.mode-map #btnA{display:block}
/* Zelda-style dialog box */
#dlg{background:var(--dlg);border:3px solid #000;border-top:none;border-radius:0 0 10px 10px;padding:8px}
.dlg-inner{display:flex;gap:10px;border:3px solid var(--dlgline);border-radius:8px;padding:10px 12px;min-height:150px;background:linear-gradient(#141b4a,#0d1233)}
.dlg-face{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dlg-face canvas{width:64px;height:64px;image-rendering:pixelated;background:#2a3870;border:2px solid var(--dlgline);border-radius:6px}
.dlg-body{flex:1;min-width:0}
.nameplate{display:inline-block;background:var(--dlgline);color:#0d1233;font:800 .9rem/1.2 ui-monospace,Consolas,monospace;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.nameplate small{font-weight:600;opacity:.8}
.dlg-text{font-size:1.02rem;min-height:3em;white-space:pre-wrap}
.dlg-text .caret{display:inline-block;color:var(--accent);margin-left:4px}
.dlg-extra{margin-top:6px}
.deltas{font-family:ui-monospace,Consolas,monospace;font-size:.88rem;background:#0a0e26;border-radius:6px;padding:4px 8px;margin:.3em 0;display:inline-block}
.up{color:var(--good)} .down{color:var(--bad)}
.note{color:var(--muted);font-size:.9rem;margin:.15em 0}
.ach{color:var(--accent);font-weight:700;font-size:.92rem;margin:.2em 0}
.dlg-choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlg-choices button{width:100%;background:#1a2260;border-color:#3a4590;padding:.4em .6em .4em 1.6em;position:relative;min-height:42px}
.dlg-choices button.hl{border-color:var(--accent);background:#2a3380}
.dlg-choices button.hl::before{content:"\25B6";position:absolute;left:.45em;color:var(--accent)}
.dlg-choices .hrs{float:right;color:var(--muted);font-size:.85rem;margin-left:8px}
.dlg-choices .why{display:block;font-size:.82rem;color:var(--bad)}
.dlg-hint{margin-top:6px;color:var(--muted);font-size:.82rem}
/* planner */
#planner{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;min-width:0}
#planner section{margin-bottom:10px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.board li{background:#1a2230;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.9rem}
.board li b{color:var(--text)}
.board li .meta{display:block;color:var(--muted);font-size:.8rem}
.board li.done{opacity:.6;text-decoration:line-through}
.board li.miss{border-color:#7a3a34;opacity:.75}
.places{display:flex;flex-direction:column;gap:5px}
.places .pl{display:flex;gap:6px;align-items:stretch}
.places .pl button{flex:1;min-height:40px;font-size:.92rem;padding:.3em .6em}
.places .pl button.ft{flex:none;font-size:.8rem;text-align:center}
.places .badge{display:inline-block;background:var(--accent);color:#141a24;border-radius:4px;padding:0 5px;margin-left:5px;font-weight:800;font-size:.8rem}
.places .hrs{float:right;color:var(--muted);font-size:.82rem}
.fu{background:#161d2a;border-radius:8px;padding:6px 10px;font-size:.9rem}
.fu ul{margin:.2em 0 .3em 1.1em;padding:0}
.muted{color:var(--muted)}
.rowbtns{display:flex;flex-wrap:wrap;gap:6px}
.rowbtns button{flex:1;text-align:center;min-height:40px;font-size:.92rem}
/* overlays */
#overlay{position:fixed;inset:0;background:rgba(5,8,14,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:10}
#overlay[hidden]{display:none}
#ovBox{background:var(--card);border:2px solid var(--accent);border-radius:12px;max-width:820px;width:100%;padding:20px;margin:auto 0}
#ovBox h1{font-size:clamp(1.5rem,5vw,2.3rem);color:var(--accent)}
#ovBox ul{padding-left:1.2em}
#ovBox li{margin:.25em 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row button{text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.modes button{padding:12px}
.modes small{display:block;color:var(--muted)}
.looks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.looks button{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.85rem;padding:6px}
.looks canvas{width:48px;height:72px;image-rendering:pixelated}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.traits button{font-size:.95rem}
.traits small{display:block;color:var(--muted)}
[aria-pressed="true"]{border-color:var(--accent)!important;background:#4a3a10!important}
input[type=text],textarea{font:inherit;background:#0f141d;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:.5em;width:100%}
.score{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:.95rem;background:#161d2a;padding:10px;border-radius:8px}
.score div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4em 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:#161d2a;color:var(--accent2)}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-weight:700;font-size:.8rem;color:#141a24;white-space:nowrap}
.tag.S{background:#9fc6ff}.tag.P{background:#ffd27f}.tag.I{background:#ff9f8f}.tag.N{background:#8fe0a0}.tag.X{background:#d7b5ff}.tag.C{background:#e0e0e0}
.good{color:var(--good)} .weak{color:var(--bad)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.5em 0}
.meters div{background:#161d2a;border-radius:6px;padding:6px 8px;font-size:.88rem}
.lvl{background:#1d3a26;border:1px solid var(--good);border-radius:8px;padding:6px 10px;margin:.4em 0}
.list-why li{margin:.2em 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font-size:.95rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tblwrap{overflow-x:auto}
/* v3: health markers, legend, route planner, sound toggles, mini-games */
.goal{border-left:4px solid var(--accent);padding:.35em .7em;background:rgba(255,210,90,.08);border-radius:4px}
.rmt{min-height:30px;padding:.1em .5em;font-size:.82rem;margin-left:6px}
.hm{display:inline-block;border-radius:3px;padding:0 4px;margin-left:3px;font-weight:800;font-size:.85em;line-height:1.35}
.hm-green{background:#2e8b45;color:#fff}.hm-amber{background:#f0b429;color:#141a24}.hm-red{background:#c0392b;color:#fff}.hm-blue{background:#2f6fdf;color:#fff}
.lbl.sign{background:rgba(47,95,168,.9);border-color:#cfe0ff;font-style:italic}
.lbl.sign.locked{background:rgba(60,64,72,.92);border-color:#ffd25a;color:#ffe6a0}
#legend{background:#0d1233;border:3px solid #000;border-top:none;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--muted)}
#legend .hm{margin-left:0;margin-right:4px}
#legend button{min-height:34px;padding:.2em .6em;font-size:.85rem;text-align:center}
body:not(.mode-map) #legend{display:none}
body.mode-map #dlg{border-radius:0}
body.mode-map #legend{border-radius:0 0 10px 10px}
.rsel{display:flex;flex-wrap:wrap;gap:5px}
.rsel button{min-height:36px;font-size:.85rem;padding:.25em .55em}
.legs{margin:.3em 0;padding-left:1.3em;font-size:.88rem}
.legs li{margin:.15em 0}
.terr ul{margin:.2em 0 .2em 1.1em;padding:0;font-size:.88rem}
.okmark{color:var(--good);font-weight:800}.nomark{color:var(--bad);font-weight:800}
.hud-btns button[aria-pressed="false"]{opacity:.8;text-decoration:line-through}
#mgCanvas{width:100%;height:auto;image-rendering:pixelated;border:3px solid #000;border-radius:8px;background:#000;touch-action:none;display:block}
.mgpad{display:flex;gap:8px;justify-content:center;margin-top:8px;user-select:none;-webkit-user-select:none}
.mgpad button{min-width:72px;min-height:56px;text-align:center;font-size:1.2rem;touch-action:none}
#mgStatus{font-family:ui-monospace,Consolas,monospace;color:var(--accent);margin:.4em 0}
@media (max-width:960px){
  #main{grid-template-columns:1fr}
  #stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  body{font-size:16px}
  #app{padding:8px 10px 20px}
  #stats{grid-template-columns:repeat(3,1fr);gap:4px 8px}
  .stat{font-size:.78rem}
  .dlg-face{width:48px}.dlg-face canvas{width:44px;height:44px}
  .dlg-inner{padding:8px;min-height:130px}
  .looks{grid-template-columns:repeat(4,1fr)}
  .traits,.modes{grid-template-columns:1fr}
  .score{grid-template-columns:1fr}
  .meters{grid-template-columns:1fr}
  #dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-top">
      <div id="when">Own the Territory</div>
      <div class="hud-btns">
        <button id="btnSfx" type="button" aria-pressed="true" title="Sound effects (M mutes everything)">Sound: On</button>
        <button id="btnMusic" type="button" aria-pressed="true" title="Background music (M mutes everything)">Music: On</button>
        <button id="btnHelp" type="button">How to play</button>
        <button id="btnMenu" type="button">Pause</button>
      </div>
    </div>
    <div id="stats"></div>
  </header>
  <main id="main">
    <section id="stageCol" aria-label="Game screen">
      <div id="stage">
        <canvas id="view" width="416" height="224" role="img" aria-label="Pixel-art game screen. On the map, drive with arrow keys or WASD, or tap a place. The place list in the planner also works."></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div id="dpad" aria-hidden="true">
          <button type="button" class="u" data-k="up" tabindex="-1">&#9650;</button>
          <button type="button" class="l" data-k="left" tabindex="-1">&#9664;</button>
          <button type="button" class="r" data-k="right" tabindex="-1">&#9654;</button>
          <button type="button" class="d" data-k="down" tabindex="-1">&#9660;</button>
        </div>
        <button id="btnA" type="button" aria-label="Go in / talk">GO IN</button>
        <div id="banner" role="status" aria-live="polite"></div>
      </div>
      <div id="dlg">
        <div class="dlg-inner">
          <div class="dlg-face"><canvas id="dlgFace" width="32" height="32" aria-hidden="true"></canvas></div>
          <div class="dlg-body">
            <div id="dlgName" class="nameplate">Own the Territory</div>
            <div id="dlgText" class="dlg-text" aria-hidden="true"></div>
            <div id="dlgSR" class="sr" aria-live="polite"></div>
            <div id="dlgExtra" class="dlg-extra"></div>
            <div id="dlgChoices" class="dlg-choices" role="group" aria-label="Choices"></div>
            <div id="dlgHint" class="dlg-hint"></div>
          </div>
        </div>
      </div>
      <div id="legend" aria-label="Map legend"></div>
    </section>
    <aside id="planner" aria-label="Planner"></aside>
  </main>
</div>
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle" hidden><div id="ovBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   OWN THE TERRITORY  v3  (PUBLIC BETA 2026-10-17)  -  author: Britton Leggett
   ---------------------------------------------------------------------
   EDIT-ME SECTION. Everything a student reads lives in the data blocks
   below: CONFIG, LOOKS, TRAITS, CAST, SPIN_GUIDE, DISCOVERY_LEVELS,
   FOLLOW_LEVELS, ACHIEVEMENTS, BUYERS (SPIN conversations), DEALS,
   PROSPECTS, LOCATIONS, SCENES, EVENTS, WEEKEND, ENDINGS, EPILOGUE.
   See README.md for the field reference.
   Text placeholders: {name} = player's name, {kin} = "son"/"nephew",
   {c.counter} = a counter, {lastLost} = last lost deal, {period} = "month"
   or "week", {money} = commission so far, {spinBuyer} = the buyer you had
   your big Tuesday conversation with (quick mode).
   All companies and people are fictional. Money is fictional game money.
   ===================================================================== */

const CONFIG = {
  title: "Own the Territory",
  subtitle: "One truck. One territory. Nobody hands you a schedule.",
  company: "Heron Point Supply",
  defaultName: "Jordan",
  dayStart: 8,              // 8:00 AM
  quitTime: 17,             // 5:00 PM: after this, hours are overtime
  hardStop: 19,             // 7:00 PM: the day is over
  overtimeLifePerHour: 3,   // Life lost per overtime hour of WORK...
  freeOvertimePerWeek: 3,   // ...but the first 3 late hours each week cost nothing (a late night now and then is normal)
  commissionRate: 0.10,     // you earn 10% of every deal you win (a game rule only, not a real pay claim)
  startStats: { trust: 50, integrity: 60, life: 70 },
  startCommunity: 10,       // how well the parish knows you (0-100)
  knownByName: 45,          // Community needed for the "they know your name" moment at the end
  modes: {
    quick: {
      label: "Quick Mode", blurb: "About 10-13 minutes. Monday, Tuesday, Friday. Five big decisions, and maybe a new territory.",
      days: 3, dayNames: ["Monday", "Tuesday", "Friday"], weekdays: [1, 2, 5], period: "week",
      thresholds: { high: 2200, mid: 1300, low: 450 },
      freeOvertimePerWeek: 2, fridayOffAt: 1000, knownByName: 25,
      outlook: { perCommunity: 30, perRivalWin: 60, perRedSite: 90, longCycleShare: 0.3, perAltWin: 40, strong: 650, steady: 350 },  // the "next week's pipeline outlook (estimate)" line on the report
      neglect: { amber: 2, red: 3, pickoff: 0, remoteAge: 1 },   // days since your last in-person visit before an account turns amber / red (Quick: Mon=1, Tue=2, Fri=3, end=4). remoteAge: a phone/video check-in counts as a visit this many days ago (a partial reset)
      expansionStyle: { aggressiveShare: 0.65, minStops: 2 },   // final report: "Expanded aggressively" = Texas took at least this share of your working hours after you accepted (and 2+ Texas stops). Quick Mode only has one Texas day (Friday), so its bar is higher
      huddleWeekday: 5,                            // Renee's 8-9 AM huddle at HQ (Friday in Quick Mode)
      expansion: { offerDays: [2, 2], phase: "evening" },   // when Renee can offer Beaumont (after Tuesday)
      startDeals: ["q_sassafras", "q_possum", "q_pirogue"],
      boardNote: { 1: "Three prospects, time for two. The one you skip, somebody else will see.",
                   2: "One big meeting today. The afternoon is yours: follow-ups, the ballfield, or home.",
                   3: "Friday. The week decides today. So do you." },
      intro: "Welcome aboard, {name}. Dale moved up to the Houston branch and left you his accounts, his truck, and half a bag of cracklins.\nThis is the short version of the job: one week, the days that matter.\nMonday you've got three prospects on Dale's list and time to see two. Pick well. The one you skip, somebody else will see.\nBeaumont, across the Sabine, is uncovered. Sell well by Tuesday and we'll talk.\nNobody's going to hand you a schedule. Your calendar is yours. So are the results. - Renee Hebert, Sales Manager"
    },
    full: {
      label: "Full Month", blurb: "About 45-60 minutes. Four weeks, weekends, a rival, a whale of a bid.",
      days: 20, dayNames: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], weekdays: null, period: "month",
      thresholds: { high: 12000, mid: 8000, low: 2500 },
      freeOvertimePerWeek: 3, fridayOffAt: 900, knownByName: 57,
      outlook: { perCommunity: 30, perRivalWin: 120, perRedSite: 300, longCycleShare: 0.35, perAltWin: 150, strong: 2500, steady: 1200 },
      neglect: { amber: 6, red: 9, pickoff: 0.15, remoteAge: 3 },  // Full Month: a red account has this daily chance that Cody takes its biggest open deal
      expansionStyle: { aggressiveShare: 0.25, minStops: 2 },
      huddleWeekday: 1,                             // Renee's 8-9 AM huddle at HQ (Mondays)
      expansion: { offerDays: [6, 11], phase: "morning" },  // a Monday after week 1 (week 2 or week 3)

/* SPIN GUIDE: used in the after-conversation debrief. These are our own paraphrases of the
   ideas in Neil Rackham's SPIN Selling (1988), chapters 3-4. No quotes. Page notes are in README. */
const SPIN_GUIDE = {
  S: { name: "Situation", def: "Gathers facts about the buyer's current setup. You need a few, but buyers get bored fast, and the research behind SPIN found that stronger sellers ask fewer of them and do their homework before the call." },
  P: { name: "Problem", def: "Asks about difficulties, dissatisfactions, or things that aren't working. The answers are the buyer's implied needs. In small sales, finding problems can be enough; in big sales, it's only the starting point." },
  I: { name: "Implication", def: "Explores what a problem leads to: cost, risk, delays, knock-on effects. This is how a small-sounding problem grows big enough to justify a big purchase. Stack too many without offering a way forward, though, and the buyer starts to feel gloomy." },
  N: { name: "Need-payoff", def: "Asks about the value of solving the problem, so the buyer names the benefits in their own words. It works best after the problem is developed. Asked too early it can feel pushy, and it puts the buyer on the defensive." },
  X: { name: "Pitch", def: "Describing your products or features. In a small sale, offering a fix right after you find the problem can work fine. In a big sale, pitching before the buyer feels the size of the problem tends to draw objections, usually about price." },
  C: { name: "Next step", def: "Asking for a commitment that moves the sale forward: a proposal, a meeting with the decision maker, an order." }
};

<script>

const STAT_KEYS = ["trust", "integrity", "life"];

const EVENT_BY_ID = {}; EVENTS.forEach(e => EVENT_BY_ID[e.id] = e);
let S = null;
const ENGINE = { autosave: true, sfx: [], sfxLog: [] };   // sfx: sound cues for the UI to play (never saved)
const SAVE_KEY = "ownTheTerritory.save.v3";
function cue(name) { ENGINE.sfx.push(name); ENGINE.sfxLog.push(name); if (ENGINE.sfxLog.length > 400) ENGINE.sfxLog.splice(0, 200); }

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function num(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }
function rng() { S.seed = (S.seed + 0x6D2B79F5) | 0; let t = S.seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function M() { return CONFIG.modes[S.gm] || CONFIG.modes.full; }
function totalDays() { return M().days; }
function weekday(d) { d = d || S.day; return M().weekdays ? M().weekdays[d - 1] : ((d - 1) % 5) + 1; }
function weekNo() { return S.gm === "quick" ? 1 : Math.floor((S.day - 1) / 5) + 1; }
function weeksTotal() { return S.gm === "quick" ? 1 : Math.ceil(M().days / 5); }
function dayName(d) { d = d || S.day; return M().dayNames[M().weekdays ? d - 1 : (d - 1) % 5]; }
function inMode(x) { const m = (x && x.mode) || "full"; return m === "both" || m === S.gm; }
function cfgNum(v) { return typeof v === "string" ? num(M()[v]) : num(v); }
function knownAt() { return M().knownByName != null ? M().knownByName : CONFIG.knownByName; }
function trait() { return (S && S.char && TRAITS[S.char.trait]) || {}; }
function weekMoney() { return S.money - S.week.startMoney; }
function castName(id, first) { const c = CAST[id]; if (!c) return ""; return first ? c.name.split(" ")[0] : c.name; }

function tmpl(s) {
  if (typeof s === "function") s = s(S);
  if (s == null) return "";
  return String(s).replace(/\{(\w+)(?:\.(\w+))?\}/g, (m, a, b) => {
    if (a === "c") return String(S.counters[b] || 0);
    if (a === "name") return S.char.name;
    if (a === "kin") return S.char.trait === "parent" ? "son" : "nephew";
    if (a === "lastLost") return S.lastLost || "a deal";
    if (a === "visit") return (LOCATIONS[S.loc] && LOCATIONS[S.loc].visit) || "";

    if (a === "weekMoney") return fmt(weekMoney());
    if (a === "spinBuyer") return S.spinBuyer ? castName(S.spinBuyer, true) : "your buyer";
    return m;

}

}

  S = { v: 3, gm: CONFIG.modes[gm] ? gm : "quick", seed: (seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0), day: 1, clock: CONFIG.dayStart, loc: "home", prevLoc: "home",
    mode: "card", card: null, queue: [], after: "map", cardSeq: 0,
    char: { name: String(c.name || CONFIG.defaultName).slice(0, 16), look: c.look || LOOKS[0].id, trait: TRAITS[c.trait] ? c.trait : "athlete" },
    stats: Object.assign({}, CONFIG.startStats), community: CONFIG.startCommunity, money: 0, closed: 0,
    flags: {}, counters: {}, done: {}, deferred: {}, weekMarks: {}, daily: {}, deals: {}, usedProspects: [], lastLost: "",
    won: 0, lost: 0, hoursWorked: 0, overtime: 0, weekOT: 0, fuFast: 0, fuOnTime: 0, fuLate: 0, fuMissed: 0, homeOnTime: 0,
    notes: [], flash: [], ending: null, xp: { disc: 0, ft: 0 }, lv: { disc: 1, ft: 1 }, achievements: {},
    log: { won: [], lost: [], sacrificed: [], rival: [], levelUps: [] }, rival: { wins: [], at: null, atDay: -99 },
    pulledForward: 0, family: 0, visited: { home: true }, board: {}, conv: null, lastDebrief: null, debriefs: [],
    spinBuyer: null, spinDeal: null, spinLoc: null, week: null, reports: [], finalReport: null,

/* ---------- deals ---------- */
function addDeal(id, quiet) {

    const pool = TX_PROSPECTS.filter(p => S.usedProspects.indexOf(p.name) < 0);

function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(c => c && e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return e;
}
function paras(text) { return String(text).split("\n").map(t => el("p", { text: t })); }
function toast(msg, ms) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(UI.tt); UI.tt = setTimeout(() => t.classList.remove("show"), ms || 2000); }

/* ---------- HUD ---------- */
function renderHUD() {
  const w = $("when");
  if (!S) { w.textContent = CONFIG.title; $("stats").innerHTML = ""; return; }
  w.innerHTML = "";
  const head = M().label + " · " + (S.mode === "ending" ? (S.gm === "quick" ? "Week complete" : "Month complete") : ((S.gm === "full" ? "Week " + weekNo() + " · " : "") + dayName()));
  w.appendChild(el("span", { text: head + (S.mode === "ending" ? "" : " · ") }));
  if (S.mode !== "ending") {
    w.appendChild(el("b", { text: clockLabel(S.clock) }));
    w.appendChild(el("span", { class: "muted", text: S.clock >= CONFIG.quitTime ? "  (overtime; day ends 7 PM)" : "  (" + fmtHours(CONFIG.quitTime - S.clock) + " to quitting time)" }));
  }

  const D = DISCOVERY_LEVELS, nx = D[S.lv.disc] ? levelXP(D[S.lv.disc]) : null;
  const discPct = nx == null ? 100 : clamp((S.xp.disc - levelXP(D[S.lv.disc - 1])) / (nx - levelXP(D[S.lv.disc - 1])) * 100, 0, 100);
  [["Commission", "$" + fmt(S.money), null], ["Trust", Math.round(S.stats.trust), S.stats.trust], ["Integrity", Math.round(S.stats.integrity), S.stats.integrity],

    st.appendChild(d);

}

    const li = el("li", { class: it.done ? "done" : (it.late ? "miss" : "") });

    if (it.text) li.appendChild(el("span", { text: " " + it.text }));
    li.appendChild(el("span", { class: "meta", text: it.place + (it.timing ? " · " + it.timing : "") + (it.until ? " · " + it.until : "") + (it.done ? " · done" : it.late ? " · too late today" : "") }));
    ul.appendChild(li);

  p.appendChild(territorySection());
  p.appendChild(accountsSection());
  const opts = onMap ? getOptions() : [];

    const row = el("div", { class: "rowbtns" });
    opts.forEach((o, i) => { if (o.kind === "followups" || o.kind === "gohome") { const b = el("button", { type: "button", class: o.kind === "gohome" ? "primary" : "", onclick: () => doPick(i) }, [o.label + (o.hours ? " · " + fmtHours(o.hours) : "")]); if (o.disabled) b.disabled = true; row.appendChild(b); } });
    s2.appendChild(row); p.appendChild(s2);

  s3.appendChild(el("p", { class: "muted", text: onMap ? "Drive there yourself, or tap Drive. Places you've been get Fast travel. Same clock cost either way." : "Finish what you're doing first." }));
  const pl = el("div", { class: "places" });
  const all = onMap ? opts : [];
